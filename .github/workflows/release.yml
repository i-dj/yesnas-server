name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version or tag (optional, e.g. v1.0.0)"
        required: false
        type: string
      release_name:
        description: "Release name (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - name: Generate version and release name
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          raw_version="${{ github.event.inputs.version }}"
          raw_release_name="${{ github.event.inputs.release_name }}"

          if [[ -n "${raw_version}" ]]; then
            version="${raw_version}"
            if [[ "${version}" != v* ]]; then
              version="v${version}"
            fi
          else
            timestamp="$(date -u +'%Y.%m.%d-%H%M%S')"
            version="v${timestamp}-${GITHUB_RUN_NUMBER}"
          fi

          if [[ -n "${raw_release_name}" ]]; then
            release_name="${raw_release_name}"
          else
            release_name="YesNAS ${version}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_name=${release_name}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.goarch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        shell: bash
        run: go test ./...

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/yesnas-server" .

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail

          package_root="dist/yesnas-server-linux-${GOARCH}"
          archive_name="yesnas-server-linux-${GOARCH}.tar.gz"

          rm -rf "${package_root}"
          mkdir -p "${package_root}"

          cp "dist/yesnas-server" "${package_root}/yesnas-server"

          if [[ -f README.md ]]; then
            cp README.md "${package_root}/"
          fi
          if [[ -f LICENSE ]]; then
            cp LICENSE "${package_root}/"
          fi
          if [[ -f deploy/yesnas.service ]]; then
            cp deploy/yesnas.service "${package_root}/"
          fi
          if [[ -d scripts ]]; then
            mkdir -p "${package_root}/scripts"
            find scripts -maxdepth 1 -type f \( -name '*.sh' -o -name '*.bash' \) -exec cp {} "${package_root}/scripts/" \;
          fi

          printf '%s\n' "${VERSION}" > "${package_root}/VERSION"

          tar -C dist -czf "dist/${archive_name}" "$(basename "${package_root}")"
          sha256sum "dist/${archive_name}" > "dist/${archive_name}.sha256"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
